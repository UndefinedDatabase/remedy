<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remedy</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #e8ecf1; }
  #app { width: 100%; height: 100%; position: relative; }
  #canvas-container { width: 100%; height: 100%; }
  #detail-card {
    display: none;
    position: absolute;
    top: 24px;
    right: 24px;
    width: 320px;
    max-height: calc(100vh - 48px);
    overflow-y: auto;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06);
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #1a2332;
    z-index: 100;
  }
  #detail-card.visible { display: block; }
  #detail-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  #detail-card .subtitle { font-size: 12px; color: #6b7a8d; margin-bottom: 12px; }
  #detail-card .field { margin-bottom: 10px; }
  #detail-card .field-label { font-size: 11px; color: #8899aa; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
  #detail-card .field-value { font-size: 13px; line-height: 1.4; }
  #detail-card .close-btn {
    position: absolute; top: 12px; right: 12px;
    width: 24px; height: 24px; border: none; background: #f0f2f5;
    border-radius: 6px; cursor: pointer; font-size: 14px; color: #6b7a8d;
    display: flex; align-items: center; justify-content: center;
  }
  #detail-card .close-btn:hover { background: #e0e4e9; }
  #detail-card .advanced-toggle {
    font-size: 12px; color: #6b7a8d; cursor: pointer; margin-top: 8px;
    border: none; background: none; padding: 4px 0;
  }
  #detail-card .advanced-content { display: none; margin-top: 8px; }
  #detail-card .advanced-content.open { display: block; }
  #zoom-indicator {
    position: absolute; bottom: 24px; left: 24px;
    background: rgba(255,255,255,0.85); border-radius: 8px;
    padding: 8px 14px; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 12px; color: #4a5568; box-shadow: 0 1px 6px rgba(0,0,0,0.08);
    z-index: 50;
  }
</style>
</head>
<body>
<div id="app">
  <div id="canvas-container"></div>
  <div id="detail-card"></div>
  <div id="zoom-indicator">Zoom: Origin</div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
