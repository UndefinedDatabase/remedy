[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remedy"
version = "0.1.0"
requires-python = ">=3.10"
# Upper bounds stop a new major version arriving unannounced; `constraints.txt` pins the exact
# versions CI installs and is regenerated by its own header command (DECISION F279 D1).
dependencies = ["pydantic>=2.0,<3", "psutil>=5.9,<8"]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "ruff==0.15.17", "mypy", "pytest-cov", "coverage", "uv==0.12.18"]
ollama = ["ollama>=0.4"]
anthropic = ["anthropic>=0.40"]

[project.scripts]
remedy = "apps.cli.grouped:main"

[tool.hatch.build.targets.wheel]
packages = ["packages", "apps"]
# The wheel carries no UI any more: the old cockpit and its `apps/ui/dist` carry were deleted
# (amend1015f D3, which reverses DECISION F086 D1).

[tool.hatch.build.targets.wheel.hooks.custom]
# WHY: embeds the revision the wheel was built from, which `remedy --version` reports
# (DECISION F086 D2).
path = "hatch_build.py"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "unit: Pure logic tests, no I/O, no subprocess, no network",
    "integration: Tests with temp files, storage, orchestration state",
    "subprocess: Tests that spawn child processes (CLI, runtime)",
    "smoke: Smoke contract tests for scripts and infrastructure",
    "slow: Tests that take >5s individually",
    "real_ollama: Requires running Ollama server (opt-in via env)",
    "ui_contract: Python-verifiable frontend/UI contracts",
    "safety: Resource safety and process isolation guards",
    "architecture: Structural guards (no step files, imports, namespaces)",
]

# -- Ruff (baseline v0) --
[tool.ruff]
target-version = "py310"
line-length = 120
# WHY: the gauntlet sample project is its own project rooted at its own directory,
# and its import sorting is correct there (`sampleproj` is first-party). Without
# its root named here ruff reads `sampleproj` as third-party, and the file cannot
# be "fixed" instead: the template is digest-frozen in scripts/gauntlet_orders.
src = [".", "scripts/gauntlet_sample_project", "scripts/bench_sample_project"]
extend-exclude = [
    ".git",
    ".data",
    ".pytest_cache",
    "__pycache__",
    "node_modules",
    # WHY: `.agent/authored/` holds byte-verbatim transport copies of the payloads a round
    # applied; they are records, never imported or run, and cannot be edited once committed,
    # so linting them would bind a landed record to a rule it can no longer meet (DECISION
    # F263 D3). The applied file itself is linted where it lives.
    ".agent/authored",
]

[tool.ruff.lint]
# BLE001 (blind `except Exception`): a handler that must catch everything carries
# `# noqa: BLE001 — <reason>`, and tests/test_ble001_ratchet.py holds their count
# and their reasons (F278 T003, DECISION F278 D7).
# T20 (`print`) is selected for `packages/` only: a call that must print carries
# `# noqa: T201 — <reason>`, and tests/test_t201_ratchet.py holds their count (F203, DECISION F203 D3).
select = ["E", "F", "W", "I", "UP", "BLE001", "T20", "PLC0414"]
ignore = [
    "E501",   # line-too-long — 330 hits across long descriptions and compact data; deferred
    "E702",   # multiple-statements-on-semicolon — 136 hits in compact test/data patterns; deferred
    "E741",   # ambiguous-variable-name — 30 hits (l, I, O as loop vars); existing patterns; deferred
    "F841",   # unused-variable — 47 hits; many are intentional (capturing return values); deferred
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F811", "BLE001", "T20"]  # F811: pytest fixtures redefine names intentionally; BLE001: a test may catch anything to assert on it; T20: a test may print
"apps/**" = ["T20"]  # a command line prints by design
"scripts/**" = ["T20"]  # a command line prints by design
"packages/orchestration/run_contract.py" = ["F402"]  # loop var `field` shadows dataclass import — safe

# -- Mypy (permissive baseline v0) --
[tool.mypy]
python_version = "3.10"
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = false
warn_return_any = false
check_untyped_defs = false
disallow_untyped_defs = false
no_implicit_optional = false
pretty = true
show_error_codes = true

# Mypy module excludes — baseline v0, 144 errors in 42 files deferred.
# Top offenders: agent_loop (12), worker_queue (11); ui_view_model (24) was deleted with the
# old cockpit, as was guidance.
# These require architectural typing work beyond this baseline block.
[[tool.mypy.overrides]]
module = [
    "packages.orchestration.agent_loop",
    "packages.orchestration.command_discovery",
    "packages.orchestration.project_brain",
    "packages.orchestration.verifier",
    "packages.orchestration.do_run",
    "packages.orchestration.autonomy_readiness",
    "packages.orchestration.builder_bridge",
    "packages.orchestration.change_set",
    "packages.orchestration.context_coverage",
    "packages.orchestration.do_continue",
    "packages.orchestration.proof_chain",
    "packages.orchestration.real_test_execution",
    "packages.orchestration.test_execution_service",
    "packages.orchestration.trust_report",
    "packages.orchestration.ui_server",
    "packages.providers.ollama_builder.provider",
    "packages.providers.ollama_planner.provider",
    "apps.cli.command_catalog",
    "apps.cli.grouped",
    "apps.cli.commands.job",
    "apps.cli.commands.repair_cmd",
    "apps.cli.commands.snapshot_cmds",
]
ignore_errors = true

# -- Coverage (baseline v0 — measure first, then set fail_under) --
[tool.coverage.run]
branch = true
source = ["packages", "apps"]
omit = [
    "*/__pycache__/*",
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
fail_under = 75.0  # baseline v0 measured at 76.3%; rounded down for safety margin
