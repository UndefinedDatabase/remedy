# Remedy's own CI, hosted. This file is a THIN WRAPPER on purpose: it installs a
# toolchain and then calls the local CI entrypoint exactly once. The stage table
# in packages/orchestration/ci_stages.py decides what runs, in what order and
# under which budget, so this workflow names no stage and selects no tests of its
# own — one source of truth for what CI means (T2_F083).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # T2_F083's no-rerun rule — "retries hide rot" — so no step here is ever
    # re-attempted automatically and a red run stays red until a human reads it.
    # The 90-minute job cap sits ABOVE the 65 minutes the CI stage budgets sum to
    # (3900 s), so a slow stage dies at ITS OWN budget and names itself in the
    # summary, instead of the job being killed first and naming no stage at all.
    timeout-minutes: 90
    # pyproject.toml promises `requires-python = ">=3.10"`, so the floor AND a
    # current interpreter both run the whole suite (F273 T016 (a): 3.11 changed
    # how a str-mixed enum formats and a 3.10-only CI could not see it). No
    # fail-fast: one column's red must not cancel the other and hide its colour.
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        # Full history, not the checkout's default depth of one commit: the
        # event-name coupling ratchet reads deleted modules out of git history,
        # and a shallow clone hands it an empty corpus (finding R-0889).
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: constraints.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      # The local-model client extra is installed too, and it is NOT optional
      # for the suite: the study command's reachability test asserts that the
      # command asked the model host its own fixture opened, and the structured
      # call factory answers None at the client import before it contacts any
      # host — so without that package the assertion is unmeetable and the
      # column is red for an environment reason rather than a product one
      # (R-1009, 2026-09-20). Installing it brings the hosted environment into
      # line with the one the suite is verified in. It starts no server, and it
      # changes nothing in process: the fixture in tests/conftest.py refuses the
      # client for every in-process test that is not opted in to a live server,
      # and its own comment says the not-installed path exists to reproduce the
      # hosted behaviour. Only a subprocess test can reach a host, and only the
      # loopback one its own fixture opens.
      # NOTE: this comment deliberately spells no stage marker expression — the
      # workflow must name no test selection of its own, which
      # tests/orchestration/test_ci_workflow.py enforces by substring.
      # DECISION F279 D1: the toolchain is HASH-PINNED. `constraints.txt` is generated
      # from the dev and local-client extras by the command in its own header, and one
      # hash in a requirements file puts pip into hash-checking mode for the whole
      # install, which refuses an editable one. So the pinned set is installed first
      # and by itself, a changed artifact failing the step; Remedy follows with no
      # dependency resolution at all; and `pip check` fails the job if the pinned set
      # does not cover what `pyproject.toml` declares.
      - name: Install the hash-pinned toolchain
        run: python3 -m pip install --require-hashes -r constraints.txt

      - name: Install Remedy itself, resolving nothing
        run: python3 -m pip install --no-deps -e .

      - name: Check the pinned set covers every declared dependency
        run: python3 -m pip check

      # DECISION F083 D6: the UI toolchain is a PRECONDITION of the `ui` stage,
      # not a part of it. Without this install the stage's tsc check skips here
      # exactly as it skips on a local checkout that never ran it, and the
      # Acceptance line would be met by a skip instead of by a real compile.
      - name: Install the UI toolchain
        run: npm ci --prefix apps/ui

      - name: Run Remedy CI
        run: remedy ci run
